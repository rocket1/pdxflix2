<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDXFlix — Portland, OR Movie Times</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="header-left">
      <button type="button" id="headerBack" class="header-back" aria-label="Back" hidden>&larr;</button>
      <div class="logo"><span class="pdx">PDX</span><span class="flix">FLIX</span></div>
    </div>
    <div class="header-right">
      <a href="#/advertise" class="advertise-link">Advertise with us</a>
    </div>
  </header>

  <main>
    <div id="listView">
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Search movies…" />
        <div class="filter-group" id="filterToggle">
          <button data-filter="all" class="active">All</button>
          <button data-filter="first">First Run</button>
          <button data-filter="second">Second Run</button>
        </div>
      </div>
      <div class="meta-line" id="metaLine">Loading showtimes…</div>

      <div class="content-card">
        <div class="tabs" id="viewTabs">
          <button class="tab-btn active" data-view="movies">Movies</button>
          <button class="tab-btn" data-view="theatres">Theatres</button>
        </div>
        <div class="movie-list" id="movieList">
          <div class="no-results">Loading…</div>
        </div>
      </div>
    </div>

    <div id="movieDetailPage" hidden></div>
    <div id="advertisePage" hidden></div>
    <div id="statsPage" hidden></div>
  </main>

  <footer>
    PDXFlix is an unofficial, free listings mashup for personal use. Showtimes sourced from cinemaclock.com; not affiliated with any theater chain.
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

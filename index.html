<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDXFlix — Portland, OR Movie Times</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="logo"><span class="pdx">PDX</span><span class="flix">FLIX</span></div>
    <svg class="ticket-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4zM9 6h2v2H9V6zm0 4h2v2H9v-2zm0 4h2v2H9v-2zm0 4h2v2H9v-2z"/>
    </svg>
  </header>

  <main>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search movies…" />
      <div class="filter-group">
        <button data-filter="all" class="active">All</button>
        <button data-filter="first">First Run</button>
        <button data-filter="second">Second Run</button>
      </div>
    </div>
    <div class="meta-line" id="metaLine">Loading showtimes…</div>

    <div class="movie-list" id="movieList">
      <div class="no-results">Loading…</div>
    </div>
  </main>

  <footer>
    PDXFlix is an unofficial, free listings mashup for personal use. Showtimes sourced from cinemaclock.com; not affiliated with any theater chain.
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
